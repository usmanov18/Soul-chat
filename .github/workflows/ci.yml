name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests manage.py alembic alembic_schema.py

      - name: Unit + integration tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
          REDIS_ENABLED: "false"
          SUBSCRIPTION_REQUIRED: "false"
        run: pytest -q --maxfail=1

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soulchat
          POSTGRES_PASSWORD: soulchat
          POSTGRES_DB: soulchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The PostgreSQL-only code paths (EXTRACT, FOR UPDATE, the partial unique
      # index) are unreachable on SQLite, so this job exists to exercise them
      # against a real server rather than trusting dialect compilation alone.
      - name: Migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://soulchat:soulchat@localhost:5432/soulchat
        run: |
          alembic upgrade head
          alembic downgrade 0001_initial
          alembic upgrade head

      - name: Unit + integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://soulchat:soulchat@localhost:5432/soulchat
          REDIS_ENABLED: "false"
          SUBSCRIPTION_REQUIRED: "false"
        run: pytest -q --maxfail=1

  frontend:
    name: Admin panel tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: soulchat/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max