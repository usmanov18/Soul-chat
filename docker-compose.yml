name: soulchat

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soulchat}
      POSTGRES_USER: ${POSTGRES_USER:-soulchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soulchat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soulchat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-soulchat}:${POSTGRES_PASSWORD:-soulchat}@postgres:5432/${POSTGRES_DB:-soulchat}
      REDIS_URL: redis://redis:6379/0
    entrypoint: ["/bin/sh", "docker-entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - archives:/app/data
    expose:
      - "8000"

  bot:
    build: ./backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-soulchat}:${POSTGRES_PASSWORD:-soulchat}@postgres:5432/${POSTGRES_DB:-soulchat}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "manage.py", "bot"]

  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-soulchat}:${POSTGRES_PASSWORD:-soulchat}@postgres:5432/${POSTGRES_DB:-soulchat}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: ["celery", "-A", "celery_worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - archives:/app/data

  beat:
    build: ./backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-soulchat}:${POSTGRES_PASSWORD:-soulchat}@postgres:5432/${POSTGRES_DB:-soulchat}
      CELERY_BROKER_URL: redis://redis:6379/1
    command: ["celery", "-A", "celery_worker.celery_app", "beat", "--loglevel=INFO"]
    volumes:
      - archives:/app/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/soulchat.conf:/etc/nginx/conf.d/default.conf:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
  archives:
