global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: soulchat
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: soulchat-backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]